<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Quilio — Read. Ask. Learn.</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<style>
  .intro-wrap{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:32px;
    position:relative;
    overflow:hidden;
  }
  .field-glow{
    position:absolute;
    inset:0;
    background:
      radial-gradient(38% 32% at 22% 20%, rgba(99,102,241,0.16), transparent 60%),
      radial-gradient(30% 26% at 78% 74%, rgba(168,85,247,0.13), transparent 60%);
    pointer-events:none;
  }
  .mark{
    width:88px;height:88px;
    margin-bottom:28px;
    animation:markIn 1.1s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes markIn{
    from{opacity:0;transform:scale(.7) rotate(-8deg);}
    to{opacity:1;transform:scale(1) rotate(0deg);}
  }
  .mark path{
    stroke-dasharray:340;
    stroke-dashoffset:340;
    animation:draw 1.6s ease forwards .15s;
  }
  @keyframes draw{ to{stroke-dashoffset:0;} }

  h1.wordmark{
    font-family:'Newsreader',serif;
    font-weight:500;
    font-size:52px;
    letter-spacing:-0.01em;
    margin:0 0 14px;
    opacity:0;
    animation:fadeUp .8s ease forwards .9s;
  }
  p.tagline{
    color:var(--text-muted);
    font-size:16.5px;
    max-width:420px;
    line-height:1.55;
    margin:0 0 36px;
    opacity:0;
    animation:fadeUp .8s ease forwards 1.1s;
  }
  .cta-row{
    display:flex;gap:12px;
    opacity:0;
    animation:fadeUp .8s ease forwards 1.3s;
  }
  @keyframes fadeUp{
    from{opacity:0;transform:translateY(10px);}
    to{opacity:1;transform:translateY(0);}
  }
  .thread-line{
    position:absolute;
    bottom:64px;left:50%;
    transform:translateX(-50%);
    color:var(--text-faint);
    font-size:12.5px;
    letter-spacing:0.02em;
    display:flex;gap:22px;
    opacity:0;
    animation:fadeUp .8s ease forwards 1.6s;
  }
  .thread-line span{position:relative;}
  .thread-line span:not(:last-child)::after{
    content:'';
    position:absolute;
    right:-13px;top:50%;
    width:5px;height:1px;
    background:var(--text-faint);
  }
</style>
</head>
<body>
  <div class="intro-wrap">
    <div class="field-glow"></div>

    <svg class="mark" viewBox="0 0 88 88" fill="none">
      <defs>
        <linearGradient id="g1" x1="0" y1="0" x2="88" y2="88">
          <stop offset="0%" stop-color="#6366F1"/>
          <stop offset="100%" stop-color="#A855F7"/>
        </linearGradient>
      </defs>
      <path d="M44 6C23 6 6 23 6 44s17 38 38 38c9 0 17.3-3.2 23.8-8.6" stroke="url(#g1)" stroke-width="5" stroke-linecap="round"/>
      <path d="M44 82c21 0 38-17 38-38 0-9-3.2-17.3-8.6-23.8" stroke="url(#g1)" stroke-width="5" stroke-linecap="round" opacity="0.45"/>
      <circle cx="44" cy="44" r="10" fill="url(#g1)"/>
      <line x1="58" y1="58" x2="70" y2="70" stroke="url(#g1)" stroke-width="5" stroke-linecap="round"/>
    </svg>

    <h1 class="wordmark">Quilio</h1>
    <p class="tagline">Every article, woven into something you can ask, learn, and remember. Read technical writing the way you actually understand it.</p>

    <div class="cta-row">
      <a href="feed.html" class="btn btn-primary">Get started</a>
      <a href="feed.html" class="btn btn-ghost">I already have an account</a>
    </div>

    <div class="thread-line">
      <span>Read</span><span>Ask</span><span>Learn</span><span>Remember</span>
    </div>
  </div>
</body>
</html>
