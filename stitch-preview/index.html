<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quilio — Original Stitch Design Screens</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #0c0e13; color: #e2e2e9; }
    header { padding: 20px 24px; border-bottom: 1px solid rgba(255,255,255,.08); }
    h1 { margin: 0 0 6px; font-size: 1.25rem; }
    p { margin: 0; color: #908fa0; font-size: 14px; }
    .grid { display: grid; gap: 24px; padding: 24px; max-width: 900px; margin: 0 auto; }
    figure { margin: 0; background: #1a1b21; border-radius: 16px; overflow: hidden; border: 1px solid rgba(255,255,255,.08); }
    figcaption { padding: 12px 16px; font-size: 13px; color: #c7c4d7; border-top: 1px solid rgba(255,255,255,.06); }
    img { width: 100%; display: block; background: #111; }
  </style>
</head>
<body>
  <header>
    <h1>Original Stitch design — Quilio</h1>
    <p>Screens from <code>stitch_quilio_ai_learning_platform.zip</code>. Preview only — not your app code.</p>
  </header>
  <div class="grid">
    <figure>
      <img src="00-logo.png" alt="Logo" />
      <figcaption>00 — Brand wordmark / emblem</figcaption>
    </figure>
    <figure>
      <img src="01-intro.png" alt="Intro" />
      <figcaption>01 — Intro / Convergence Gateway (splash)</figcaption>
    </figure>
    <figure>
      <img src="02-auth.png" alt="Auth" />
      <figcaption>02 — Authentication (Login / Register)</figcaption>
    </figure>
    <figure>
      <img src="03-home-feed.png" alt="Home" />
      <figcaption>03 — Home feed (bottom nav: Home · Learn · Write · Progress · Profile)</figcaption>
    </figure>
    <figure>
      <img src="04-post-detail.png" alt="Post" />
      <figcaption>04 — Post detail reader</figcaption>
    </figure>
    <figure>
      <img src="05-learn-this.png" alt="Learn" />
      <figcaption>05 — Learn This (quiz / study)</figcaption>
    </figure>
    <figure>
      <img src="06-write-ai.png" alt="Write" />
      <figcaption>06 — Write with AI studio</figcaption>
    </figure>
  </div>
</body>
</html>
