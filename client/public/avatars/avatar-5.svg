  </defs>
  <circle cx="64" cy="64" r="64" fill="url(#bg5)"/>
  <circle cx="64" cy="64" r="64" fill="url(#shine5)"/>
  <!-- head -->
  <circle cx="64" cy="52" r="22" fill="#0c0e13" opacity="0.22"/>
